        <title>Convertitore</title>
        <link rel="stylesheet" href="./style.css" />

    <body>
        <main>
            <label for="bin">Binario</label>
            <input pattern="[01]*" maxlength="16" type="text" id="bin" />

            <input pattern="-?[0123456789]*" max="32767" min="-32768" type="text" id="dec" />
